<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찾는 글이 없어요 | 생활 해결 가이드</title>
<meta name="description" content="없는 페이지">
<link rel="canonical" href="https://duruguide.com/">
<meta property="og:title" content="찾는 글이 없어요 | 생활 해결 가이드">
<meta property="og:description" content="없는 페이지">
<meta property="og:url" content="https://duruguide.com/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="생활 해결 가이드">
<meta property="og:image" content="https://duruguide.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://duruguide.com/favicon.ico" sizes="48x48">
<link rel="icon" href="https://duruguide.com/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="https://duruguide.com/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="생활 해결 가이드" href="/rss.xml">
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--soft:#f0f0f0;--muted:#4d4d4d;--link:#1622c9;
--blue:#2436ff;--red:#ff3b1f;--black:#0a0a0a;--navy:#050a5c;--yellow:#ffd928;--white:#fff;
--m:clamp(18px,3.2vw,48px);--display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--fg:#f2f3f5;--soft:#1d1f24;--muted:#b8bcc4;--link:#9fb0ff}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.75 "IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--link)}
h1,h2,h3{font-family:var(--display);font-weight:400;font-synthesis:none;margin:0;text-wrap:balance}
p{max-width:38em}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px var(--m);background:var(--black);color:var(--white)}
.top a{color:inherit;text-decoration:none}
.top .name{font:400 1.35rem/1 var(--display);white-space:nowrap}
.top nav{display:flex;gap:24px;font-size:1rem;font-weight:700}
.top nav a{padding:8px 0;white-space:nowrap}
.top nav a:hover{color:var(--yellow)}
.home .top{background:var(--blue)}

/* 첫 화면 */
.hero{background:var(--blue);color:var(--white);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:32px;padding:24px var(--m) 72px;min-height:calc(100svh - 68px);overflow:hidden}
.hero h1{font-size:clamp(88px,12.6vw,212px);line-height:.94;letter-spacing:-.025em;white-space:nowrap}
.line{display:block;overflow:hidden;padding-top:.04em}
.line>span{display:block;animation:rise .9s var(--ease) both}
.line+.line>span{color:var(--yellow);animation-delay:.11s}
.hero .lead{font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.55;font-weight:500;max-width:25em;margin:32px 0 28px;animation:up .7s var(--ease) .35s both}
.btn{display:inline-block;background:var(--yellow);color:var(--black);text-decoration:none;font:400 1.45rem/1 var(--display);padding:20px 34px;animation:up .7s var(--ease) .45s both;transition:transform .18s var(--ease),background-color .18s}
.btn:hover{background:var(--white);transform:translateY(-3px)}
.btn:active{transform:scale(.97)}

/* 0원 영수증: 상황을 누르면 바뀐다(스크립트 없음) */
.picker{justify-self:center;width:100%;max-width:450px}
.picker input{position:absolute;opacity:0;width:1px;height:1px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;animation:up .7s var(--ease) .5s both}
.picks label{cursor:pointer;background:var(--navy);color:var(--white);font-weight:700;font-size:.95rem;line-height:1.2;padding:12px 14px;transition:background-color .18s,color .18s}
.picks label:hover{background:var(--black)}
#r0:checked~.picks [for=r0],#r1:checked~.picks [for=r1],#r2:checked~.picks [for=r2],#r3:checked~.picks [for=r3]{background:var(--yellow);color:var(--black)}
#r0:focus-visible~.picks [for=r0],#r1:focus-visible~.picks [for=r1],#r2:focus-visible~.picks [for=r2],#r3:focus-visible~.picks [for=r3]{outline:4px solid var(--white)}
.slip{display:none;position:relative;background:var(--white);color:var(--black);padding:30px 28px 38px;transform:rotate(3deg);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),95% 100%,90% calc(100% - 14px),85% 100%,80% calc(100% - 14px),75% 100%,70% calc(100% - 14px),65% 100%,60% calc(100% - 14px),55% 100%,50% calc(100% - 14px),45% 100%,40% calc(100% - 14px),35% 100%,30% calc(100% - 14px),25% 100%,20% calc(100% - 14px),15% 100%,10% calc(100% - 14px),5% 100%,0 calc(100% - 14px))}
#r0:checked~.slips .s0,#r1:checked~.slips .s1,#r2:checked~.slips .s2,#r3:checked~.slips .s3{display:block;animation:print .6s var(--ease) both}
.slip-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.slip-name{font:400 2.1rem/1.1 var(--display);margin:0}
.slip .art{width:76px;height:76px;flex:none;background:var(--blue);padding:9px}
.slip .what{font-weight:700;line-height:1.45;margin:18px 0 8px}
.slip .why{font-size:1rem;line-height:1.65;margin:0}
.slip .sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--yellow);padding:12px 14px;margin:18px 0 14px;font-weight:700}
.slip .sum b{font:400 3.6rem/.85 var(--display)}
.slip a{color:var(--black);font-weight:700}

/* 면 제목 */
.big{font-size:clamp(2.8rem,7.6vw,7rem);line-height:1;letter-spacing:-.02em}

/* 이번 달 */
.month{background:var(--red);color:var(--black);padding:88px var(--m) 96px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:24px 40px;align-items:center}
.month .when{font:400 clamp(9rem,18vw,19rem)/.8 var(--display);letter-spacing:-.04em;margin:0;white-space:nowrap}
.month h2{font-size:clamp(2.1rem,4vw,3.6rem);line-height:1.05;margin-bottom:24px}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checklist a{display:flex;gap:16px;align-items:center;background:var(--black);color:var(--white);padding:16px 18px;text-decoration:none;line-height:1.4;transition:transform .2s var(--ease),background-color .2s}
.checklist a:hover{background:var(--navy);transform:translateX(8px)}
.checklist .box{flex:0 0 26px;height:26px;background:var(--white);position:relative}
.checklist a:hover .box::after{content:"";position:absolute;left:8px;top:2px;width:9px;height:17px;border:solid var(--blue);border-width:0 5px 5px 0;transform:rotate(42deg)}
.checklist strong{display:block;font-size:1.1rem}
.checklist small{display:block;font-size:.9rem}

/* 상황 판 */
.sits{background:var(--black);color:var(--white)}
.sits .big{padding:88px var(--m) 32px}
.sitnav{display:flex;flex-wrap:wrap}
.tile{position:relative;overflow:hidden;flex:1 1 25%;min-height:280px;padding:24px var(--m);display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;font:400 clamp(1.7rem,2.5vw,2.5rem)/1.1 var(--display)}
.tile:nth-child(4n+1){flex-basis:40%}
.tile:nth-child(8n+5){flex-basis:34%}
.tile .label,.tile .n{position:relative;z-index:1}
.tile .n{font:700 1rem/1.4 "IBM Plex Sans KR",sans-serif;margin-top:8px}
.tile .art{position:absolute;right:-3%;top:8px;width:60%;max-width:230px;max-height:66%;transition:transform .35s var(--ease)}
.tile:hover .art{transform:translateY(-8px) scale(1.07)}
.t-blue{background:var(--blue);color:var(--white)}.t-red{background:var(--red);color:var(--black)}
.t-navy{background:var(--navy);color:var(--white)}.t-black{background:#26282e;color:var(--white)}

/* 새 글·목록 */
.fresh{background:var(--yellow);color:var(--black);padding:88px var(--m) 80px}
.fresh .big{margin-bottom:28px}
.posts{list-style:none;padding:0;margin:0}
.posts a{display:block;color:inherit;text-decoration:none;transition:transform .2s var(--ease),background-color .2s}
.posts strong{display:block;line-height:1.4}
.posts small{display:block;font-size:.9rem;margin-top:4px}
.fresh .posts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.fresh .posts li{grid-column:span 2}
.fresh .posts li:nth-child(-n+2){grid-column:span 3}
.fresh .posts li:only-child{grid-column:span 6}
.fresh .posts a{height:100%;min-height:150px;padding:22px;background:var(--black);color:var(--white);display:flex;flex-direction:column;justify-content:space-between}
.fresh .posts li:first-child a{background:var(--blue)}
.fresh .posts strong{font:400 clamp(1.4rem,2vw,2rem)/1.2 var(--display)}
.fresh .posts a:hover{transform:translateY(-5px)}
.total{font-weight:700;margin:24px 0 0}
.groups{padding:80px var(--m);columns:2;column-gap:28px}
.groups section{break-inside:avoid;margin-bottom:36px;scroll-margin-top:16px}
.groups h2{font-size:1.9rem;line-height:1.1;padding:16px 18px}
.groups .posts{display:grid;gap:4px;margin-top:4px}
.groups .posts a{background:var(--soft);padding:14px 18px}
.groups .posts a:hover{background:var(--yellow);color:var(--black)}

/* 약속 */
.promise{background:var(--navy);color:var(--white);padding:104px var(--m);display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.promise p{font-size:clamp(1.25rem,2.1vw,1.9rem);line-height:1.6;margin:0}
.promise mark{background:var(--yellow);color:var(--black);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* 글 */
.band{padding:0 var(--m);overflow:hidden}
.band-in{max-width:980px;margin:0 auto;padding:38px 0 40px;position:relative}
.band .art{position:absolute;right:-8px;top:18px;width:200px;height:200px;animation:up .8s var(--ease) both}
.band .meta{font-size:.95rem;margin:0 0 24px;position:relative;padding-right:210px}
.band .meta a{color:inherit;font-weight:700}
.band h1{font-size:clamp(2.8rem,6.6vw,5.2rem);line-height:1.04;letter-spacing:-.015em;padding-right:210px;margin-bottom:28px;position:relative}
.band h1.long{font-size:clamp(2.1rem,4.6vw,3.6rem)}
.band h1 .sub{display:block;font:700 clamp(1.1rem,2vw,1.45rem)/1.5 "IBM Plex Sans KR",sans-serif;letter-spacing:0;margin-top:14px}
.disclosure{background:var(--white);color:var(--black);padding:12px 14px;font-size:.95rem;font-weight:500;line-height:1.6;position:relative}
.read,.plain{max-width:756px;margin:0 auto;padding:36px var(--m) 72px}
.nobuy{background:var(--yellow);color:var(--black);padding:24px;display:grid;grid-template-columns:1fr auto;gap:8px 20px}
.nobuy h2{font-size:1.9rem;line-height:1.1}
.nobuy p{grid-column:1/-1;margin:0}
.nobuy .zero{font:400 2.8rem/.85 var(--display);align-self:center}
.content h2,.plain h2,.related h2{font-size:2rem;line-height:1.15;margin:1.8em 0 .55em}
.content h3{font-size:1.45rem;margin:1.6em 0 .4em}
.content section.try ol,.content section.try ul{list-style:none;padding:0;margin:.6em 0 1em;display:grid;gap:6px}
.content section.try li{position:relative;background:var(--soft);padding:14px 16px 14px 56px}
.content section.try li::before{content:"";position:absolute;left:16px;top:18px;width:24px;height:24px;background:var(--bg);border:4px solid var(--blue)}
table{border-collapse:separate;border-spacing:0 4px;width:100%;margin:1em 0;font-size:.95rem;line-height:1.55;display:block;overflow-x:auto}
th,td{padding:12px;text-align:left;vertical-align:top}
th{background:var(--blue);color:var(--white)}
td{background:var(--soft)}
td:first-child{font-weight:700}
figure.card{margin:34px 0 0}figure.card img{display:block;width:100%;height:auto}
figure.card figcaption{color:var(--muted);font-size:.9rem;margin-top:8px}
.cta{margin:34px 0 0}
.cta a{display:block;background:var(--blue);color:var(--white);text-align:center;text-decoration:none;font:400 1.4rem/1.35 var(--display);padding:20px 18px;transition:transform .18s var(--ease)}
.cta a.cta2{margin-top:8px;background:var(--black);color:var(--white)}
.cta a:hover{transform:translateY(-3px)}
.cta p{margin:12px 0 0;color:var(--muted);font-size:.95rem;line-height:1.6}
.disclosure-foot{color:var(--muted);font-size:.9rem;margin:18px 0 0}
.related{background:var(--black);color:var(--white);padding:12px var(--m) 64px}
.related>*{max-width:980px;margin-left:auto;margin-right:auto}
.related .posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.related .posts a{height:100%;padding:20px;background:var(--navy)}
.related .posts a:hover{background:var(--blue)}
.plain h1{font-size:clamp(3rem,8vw,5.5rem);line-height:1;margin:.3em 0 .4em}
.draft-badge{background:#c62828;color:#fff;padding:2px 8px;font-size:.8rem}

/* 끝 */
.foot{background:var(--black);color:var(--white);padding:56px var(--m) 40px;font-size:.95rem;line-height:1.7}
.blocks{display:flex;align-items:flex-end;gap:4px;margin:0 0 32px;max-width:none}
.blocks span{font:400 clamp(2.4rem,10.5vw,10rem)/1 var(--display);text-align:center;padding:.16em .1em .1em;white-space:nowrap}
.blocks span:nth-child(1){flex:2;background:var(--blue);padding-top:.5em}
.blocks span:nth-child(2){flex:2;background:var(--red);color:var(--black)}
.blocks span:nth-child(3){flex:3;background:var(--yellow);color:var(--black);padding-top:.32em}
.foot-row{display:flex;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
.foot-row p{margin:0}.foot a{color:inherit;font-weight:700}

@media (max-width:900px){
.hero{grid-template-columns:minmax(0,1fr);padding-top:32px;min-height:0}
.hero h1{font-size:min(23vw,160px)}
.hero .lead{margin:22px 0 20px}
.picker{margin-top:20px}
.slip{transform:rotate(2deg)}
.month,.promise{grid-template-columns:minmax(0,1fr);padding-top:64px;padding-bottom:64px}
.month .when{font-size:min(42vw,300px)}
.sits .big,.fresh{padding-top:64px}
.tile,.tile:nth-child(n){flex:1 1 50%;min-height:200px;font-size:1.55rem;padding:16px var(--m)}
.tile:nth-child(3n+1){flex-basis:100%}
.tile .art{max-height:50%;top:10px}
.fresh .posts li,.fresh .posts li:nth-child(n){grid-column:span 6}
.fresh .posts a{min-height:0;gap:10px;padding:18px}
.groups{columns:1;padding-top:56px;padding-bottom:40px}
.related .posts{grid-template-columns:minmax(0,1fr)}
.band .art{width:88px;height:88px;top:22px;right:0}
.band .meta{padding-right:100px;min-height:88px;margin-bottom:14px}
.band h1{padding-right:0}
.top nav .about-link{display:none}
}
@media (max-width:360px){.top .name{font-size:1.1rem}.top nav{font-size:.9rem}}

/* 움직임: 숨긴 채로 남지 않게 지원하는 브라우저에서만 */
@keyframes rise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes lift{from{translate:0 36px}to{translate:0 0}}
@keyframes print{from{opacity:0;translate:0 -28px}to{opacity:1;translate:0 0}}
@supports (animation-timeline:view()){
.month .when,.month h2,.checklist li,.sits .big,.tile .art,.fresh .big,.fresh .posts li,.groups section,.promise h2,.promise p,.blocks span{animation:lift linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<main>
<div class="plain"><h1>찾는 글이 없어요</h1><p>주소가 바뀌었거나 없는 글이에요.</p><p><a href="/">홈으로 가기</a> · <a href="/#situations">상황으로 찾기</a></p></div>
</main>
<footer class="foot">
<p class="blocks" aria-hidden="true"><span>생활</span><span>해결</span><span>가이드</span></p>
<div class="foot-row"><p>안 사도 되는 방법을 먼저 적고, 살 때 볼 기준만 정리합니다.</p><p>이 사이트의 일부 링크는 제휴 링크이며, 이를 통해 구매가 이뤄지면 일정액의 수수료를 받습니다. · <a href="/about">사이트 소개</a> · <a href="/rss.xml">RSS</a></p></div>
</footer>
