<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1453" viewBox="0 0 1080 1453" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
