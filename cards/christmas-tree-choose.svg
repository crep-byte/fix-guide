<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1797" viewBox="0 0 1080 1797" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1791" rx="28" fill="#FFF6D1" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#6B4E00">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">크리스마스 트리 높이·가지 수·받침</text>
<text x="64" y="260" font-size="52" font-weight="700" fill="#111111">고르는 법</text>
<rect x="64" y="296" width="952" height="5" fill="#111111"/>
<rect x="66" y="341" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="389" font-size="48" font-weight="700" fill="#111111">높이</text>
<text x="134" y="441" font-size="39" fill="#333333">받침 포함 높이인지, 천장과 꼭대기 장식 사이에</text>
<text x="134" y="493" font-size="39" fill="#333333">여유가 있는지</text>
<rect x="64" y="523" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="563" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="611" font-size="48" font-weight="700" fill="#111111">아래 지름</text>
<text x="134" y="663" font-size="39" fill="#333333">놓을 자리와 통로 폭에 맞는지</text>
<rect x="64" y="693" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="733" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="781" font-size="48" font-weight="700" fill="#111111">가지 수·잎 모양</text>
<text x="134" y="833" font-size="39" fill="#333333">풍성한 정도, 장식을 걸 자리가 충분한지</text>
<rect x="64" y="863" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="903" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="951" font-size="48" font-weight="700" fill="#111111">받침</text>
<text x="134" y="1003" font-size="39" fill="#333333">금속인지 플라스틱인지, 넓고 무게감 있어</text>
<text x="134" y="1055" font-size="39" fill="#333333">흔들리지 않는지</text>
<rect x="64" y="1085" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="1125" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1173" font-size="48" font-weight="700" fill="#111111">조립 방식</text>
<text x="134" y="1225" font-size="39" fill="#333333">단을 끼우는 방식인지, 가지를 하나씩 펴야 하는지</text>
<rect x="64" y="1255" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="1295" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1343" font-size="48" font-weight="700" fill="#111111">조명 포함 여부</text>
<text x="134" y="1395" font-size="39" fill="#333333">조명 일체형인지 따로 감아야 하는지</text>
<rect x="64" y="1425" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="1465" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1513" font-size="48" font-weight="700" fill="#111111">소재 표기</text>
<text x="134" y="1565" font-size="39" fill="#333333">방염 처리 여부 등 제품 표기를 확인</text>
<text x="134" y="1647" font-size="30" fill="#3D3D3D">외 1가지는 본문 표에서</text>
<rect x="64" y="1687" width="952" height="2" fill="#111111"/>
<text x="64" y="1743" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1743" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
