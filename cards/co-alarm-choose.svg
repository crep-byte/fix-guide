<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1779" viewBox="0 0 1080 1779" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1773" fill="#FFD400" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#12399B">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">보일러·난로 쓰는 계절</text>
<rect x="64" y="226" width="952" height="5" fill="#111111"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">감지 대상</text>
<text x="134" y="371" font-size="39" fill="#333333">일산화탄소 전용인지, 화재 감지와 합쳐진</text>
<text x="134" y="423" font-size="39" fill="#333333">제품인지</text>
<rect x="64" y="453" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">인증 표기</text>
<text x="134" y="593" font-size="39" fill="#333333">국내 안전 인증 표기가 있는지 제품 설명을</text>
<text x="134" y="645" font-size="39" fill="#333333">확인하세요</text>
<rect x="64" y="675" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">전원</text>
<text x="134" y="815" font-size="39" fill="#333333">건전지형인지 콘센트형인지, 배터리 교체 알림이</text>
<text x="134" y="867" font-size="39" fill="#333333">있는지</text>
<rect x="64" y="897" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="937" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="985" font-size="48" font-weight="700" fill="#111111">센서 사용 기한</text>
<text x="134" y="1037" font-size="39" fill="#333333">제품에 적힌 교체 시기를 확인하세요</text>
<rect x="64" y="1067" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1107" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1155" font-size="48" font-weight="700" fill="#111111">경보음 크기</text>
<text x="134" y="1207" font-size="39" fill="#333333">잠든 방에서도 들릴 만한지, 표기된 경보음 크기</text>
<rect x="64" y="1237" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1277" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1325" font-size="48" font-weight="700" fill="#111111">표시창</text>
<text x="134" y="1377" font-size="39" fill="#333333">농도 숫자를 보여 주는지, 불빛 알림이 있는지</text>
<rect x="64" y="1407" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1447" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1495" font-size="48" font-weight="700" fill="#111111">설치 방식</text>
<text x="134" y="1547" font-size="39" fill="#333333">벽걸이·천장형·거치형, 캠핑에 들고 다닐 수</text>
<text x="134" y="1599" font-size="39" fill="#333333">있는지</text>
<rect x="64" y="1669" width="952" height="2" fill="#111111"/>
<text x="64" y="1725" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1725" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
