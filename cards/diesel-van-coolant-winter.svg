<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1575" viewBox="0 0 1080 1575" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1569" fill="#FFD400" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#12399B">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">겨울철 디젤 승합차 냉각수(부동액)</text>
<text x="64" y="260" font-size="52" font-weight="700" fill="#111111">점검과 보충</text>
<rect x="64" y="296" width="952" height="5" fill="#111111"/>
<rect x="66" y="341" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="389" font-size="48" font-weight="700" fill="#111111">규격</text>
<text x="134" y="441" font-size="39" fill="#333333">취급설명서에 적힌 냉각수 규격과 일치하는지</text>
<rect x="64" y="471" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="511" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="559" font-size="48" font-weight="700" fill="#111111">종류</text>
<text x="134" y="611" font-size="39" fill="#333333">현재 들어 있는 냉각수와 같은 종류인지(다른</text>
<text x="134" y="663" font-size="39" fill="#333333">종류를 섞지 않기)</text>
<rect x="64" y="693" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="733" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="781" font-size="48" font-weight="700" fill="#111111">형태</text>
<text x="134" y="833" font-size="39" fill="#333333">원액인지, 물과 미리 섞인 희석 제품인지</text>
<rect x="64" y="863" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="903" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="951" font-size="48" font-weight="700" fill="#111111">어는점</text>
<text x="134" y="1003" font-size="39" fill="#333333">사는 지역의 겨울 최저 기온을 견딜 수 있는지(제품</text>
<text x="134" y="1055" font-size="39" fill="#333333">표기 확인)</text>
<rect x="64" y="1085" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1125" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1173" font-size="48" font-weight="700" fill="#111111">용량</text>
<text x="134" y="1225" font-size="39" fill="#333333">보충 분량인지, 전체 교환 분량인지</text>
<rect x="64" y="1255" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1295" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1343" font-size="48" font-weight="700" fill="#111111">표기</text>
<text x="134" y="1395" font-size="39" fill="#333333">제조사, 사용 가능 차종, 제조 시기가 분명한지</text>
<rect x="64" y="1465" width="952" height="2" fill="#111111"/>
<text x="64" y="1521" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1521" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
