<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1797" viewBox="0 0 1080 1797" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1791" fill="#FFD400" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#12399B">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">강아지 겨울옷 사이즈 재는 법과 고르는</text>
<text x="64" y="260" font-size="52" font-weight="700" fill="#111111">기준</text>
<rect x="64" y="296" width="952" height="5" fill="#111111"/>
<rect x="66" y="341" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="389" font-size="48" font-weight="700" fill="#111111">가슴둘레</text>
<text x="134" y="441" font-size="39" fill="#333333">사이즈표에서 가장 먼저 맞춰야 하는 치수</text>
<rect x="64" y="471" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="511" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="559" font-size="48" font-weight="700" fill="#111111">등길이</text>
<text x="134" y="611" font-size="39" fill="#333333">너무 길면 배변할 때 옷이 걸리고, 짧으면 등이</text>
<text x="134" y="663" font-size="39" fill="#333333">드러나요</text>
<rect x="64" y="693" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="733" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="781" font-size="48" font-weight="700" fill="#111111">입히는 방식</text>
<text x="134" y="833" font-size="39" fill="#333333">머리부터 넣는 형태, 등 쪽 단추나 벨크로 형태 중</text>
<text x="134" y="885" font-size="39" fill="#333333">아이가 덜 싫어하는 것</text>
<rect x="64" y="915" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="955" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1003" font-size="48" font-weight="700" fill="#111111">다리 부분</text>
<text x="134" y="1055" font-size="39" fill="#333333">다리 구멍이 있는 형태가 겨드랑이를 쓸리지 않게</text>
<text x="134" y="1107" font-size="39" fill="#333333">하는지</text>
<rect x="64" y="1137" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1177" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1225" font-size="48" font-weight="700" fill="#111111">목줄 구멍</text>
<text x="134" y="1277" font-size="39" fill="#333333">하네스를 쓴다면 등 쪽 구멍 위치가 맞는지</text>
<rect x="64" y="1307" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1347" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1395" font-size="48" font-weight="700" fill="#111111">겉감</text>
<text x="134" y="1447" font-size="39" fill="#333333">눈이나 비를 막는 소재인지, 세탁 방법 표기</text>
<rect x="64" y="1477" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1517" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1565" font-size="48" font-weight="700" fill="#111111">반사 띠</text>
<text x="134" y="1617" font-size="39" fill="#333333">어두운 시간 산책이 많다면 반사 소재가 있는지</text>
<rect x="64" y="1687" width="952" height="2" fill="#111111"/>
<text x="64" y="1743" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1743" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
