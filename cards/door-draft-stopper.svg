<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1727" viewBox="0 0 1080 1727" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1721" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">현관·창문 틈새 바람</text>
<rect x="64" y="226" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">붙일 곳</text>
<text x="134" y="371" font-size="39" fill="#333333">여닫이문·현관문·미닫이 창·문 아래 등 어디에</text>
<text x="134" y="423" font-size="39" fill="#333333">쓸지</text>
<rect x="64" y="453" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">형태</text>
<text x="134" y="593" font-size="39" fill="#333333">스펀지형, 고무형(단면 모양별), 솔형, 문 아래</text>
<text x="134" y="645" font-size="39" fill="#333333">틈막이</text>
<rect x="64" y="675" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">틈 크기</text>
<text x="134" y="815" font-size="39" fill="#333333">틈 폭을 재서 맞는 두께인지, 제품의 적용 틈 표기</text>
<rect x="64" y="845" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="885" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="933" font-size="48" font-weight="700" fill="#111111">접착 방식</text>
<text x="134" y="985" font-size="39" fill="#333333">양면테이프형인지, 끼우거나 나사로 다는 방식인지</text>
<rect x="64" y="1015" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1055" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1103" font-size="48" font-weight="700" fill="#111111">길이</text>
<text x="134" y="1155" font-size="39" fill="#333333">붙일 둘레를 재서 여유 있는 길이인지</text>
<rect x="64" y="1185" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1225" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1273" font-size="48" font-weight="700" fill="#111111">재질</text>
<text x="134" y="1325" font-size="39" fill="#333333">오래 눌려도 복원되는지, 떼어 낼 때 자국 걱정이</text>
<text x="134" y="1377" font-size="39" fill="#333333">적은지</text>
<rect x="64" y="1407" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1447" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1495" font-size="48" font-weight="700" fill="#111111">색상</text>
<text x="134" y="1547" font-size="39" fill="#333333">문틀 색과 어울리는지</text>
<rect x="64" y="1617" width="952" height="2" fill="#111111"/>
<text x="64" y="1673" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1673" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
