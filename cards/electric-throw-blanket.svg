<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1797" viewBox="0 0 1080 1797" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1791" fill="#FFD400" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#12399B">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">세탁되는 전기요·전기담요 고르는 법과</text>
<text x="64" y="260" font-size="52" font-weight="700" fill="#111111">보관 요령</text>
<rect x="64" y="296" width="952" height="5" fill="#111111"/>
<rect x="66" y="341" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="389" font-size="48" font-weight="700" fill="#111111">세탁 방법</text>
<text x="134" y="441" font-size="39" fill="#333333">세탁기 가능인지 손세탁만인지, 조절기 분리가</text>
<text x="134" y="493" font-size="39" fill="#333333">되는지</text>
<rect x="64" y="523" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="563" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="611" font-size="48" font-weight="700" fill="#111111">안전 인증</text>
<text x="134" y="663" font-size="39" fill="#333333">KC 인증 표기가 있는지</text>
<rect x="64" y="693" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="733" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="781" font-size="48" font-weight="700" fill="#111111">자동 꺼짐</text>
<text x="134" y="833" font-size="39" fill="#333333">일정 시간 뒤 꺼지는 타이머나 과열 차단 기능이</text>
<text x="134" y="885" font-size="39" fill="#333333">있는지</text>
<rect x="64" y="915" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="955" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1003" font-size="48" font-weight="700" fill="#111111">온도 단계</text>
