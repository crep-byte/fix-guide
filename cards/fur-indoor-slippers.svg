<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1831" viewBox="0 0 1080 1831" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1825" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">겨울 털실내화 고르는 법</text>
<rect x="64" y="226" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">밑창</text>
<text x="134" y="371" font-size="39" fill="#333333">고무처럼 미끄럼 방지가 되는 재질인지, 천</text>
<text x="134" y="423" font-size="39" fill="#333333">밑창인지. 마루와 타일에서는 미끄럼 방지 밑창이</text>
<text x="134" y="475" font-size="39" fill="#333333">안전해요</text>
<rect x="64" y="505" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="545" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="593" font-size="48" font-weight="700" fill="#111111">밑창 두께</text>
<text x="134" y="645" font-size="39" fill="#333333">바닥 냉기를 막을 만큼 도톰한지, 쉽게 꺼지지 않는</text>
<text x="134" y="697" font-size="39" fill="#333333">속 재질인지</text>
<rect x="64" y="727" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="767" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="815" font-size="48" font-weight="700" fill="#111111">뒤꿈치</text>
<text x="134" y="867" font-size="39" fill="#333333">뒤가 트인 형태는 신고 벗기 편하고, 뒤가 막힌</text>
<text x="134" y="919" font-size="39" fill="#333333">형태는 벗겨지지 않아 걷기에 안정적이에요</text>
<rect x="64" y="949" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="989" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1037" font-size="48" font-weight="700" fill="#111111">크기</text>
<text x="134" y="1089" font-size="39" fill="#333333">발 길이 범위 표기. 두꺼운 양말과 함께 신을지에</text>
<text x="134" y="1141" font-size="39" fill="#333333">따라 한 치수 여유를 봐요</text>
<rect x="64" y="1171" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1211" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1259" font-size="48" font-weight="700" fill="#111111">세탁</text>
<text x="134" y="1311" font-size="39" fill="#333333">세탁기나 손빨래가 되는지, 건조 방법</text>
<rect x="64" y="1341" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1381" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1429" font-size="48" font-weight="700" fill="#111111">털 소재</text>
<text x="134" y="1481" font-size="39" fill="#333333">털 빠짐 안내와 안감 소재</text>
<rect x="64" y="1511" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1551" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1599" font-size="48" font-weight="700" fill="#111111">발소리</text>
<text x="134" y="1651" font-size="39" fill="#333333">딱딱한 밑창은 걸을 때 소리가 날 수 있어요</text>
<rect x="64" y="1721" width="952" height="2" fill="#111111"/>
<text x="64" y="1777" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1777" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
