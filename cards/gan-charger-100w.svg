<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1883" viewBox="0 0 1080 1883" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1877" rx="28" fill="#FFF6D1" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#6B4E00">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">100W GaN 멀티 충전기 고르는 기준</text>
<rect x="64" y="226" width="952" height="5" fill="#111111"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">포트별 출력</text>
<text x="134" y="371" font-size="39" fill="#333333">단독 사용 시 100W가 나오는 포트가 있는지</text>
<text x="134" y="423" font-size="39" fill="#333333">봅니다.</text>
<rect x="64" y="453" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">동시 사용 시 출력 분배</text>
<text x="134" y="593" font-size="39" fill="#333333">포트를 여러 개 쓸 때 각 포트의 출력 표를</text>
<text x="134" y="645" font-size="39" fill="#333333">확인합니다.</text>
<rect x="64" y="675" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">USB PD 지원</text>
<text x="134" y="815" font-size="39" fill="#333333">노트북 고속 충전에는 USB PD 표기가 필요합니다.</text>
<rect x="64" y="845" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="885" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="933" font-size="48" font-weight="700" fill="#111111">PPS 지원</text>
<text x="134" y="985" font-size="39" fill="#333333">일부 스마트폰의 고속 충전에 쓰입니다. 기기가</text>
<text x="134" y="1037" font-size="39" fill="#333333">지원하는지 확인합니다.</text>
<rect x="64" y="1067" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="1107" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1155" font-size="48" font-weight="700" fill="#111111">포트 구성</text>
<text x="134" y="1207" font-size="39" fill="#333333">C타입 개수와 A타입 포함 여부를 필요에 맞춰</text>
<text x="134" y="1259" font-size="39" fill="#333333">봅니다.</text>
<rect x="64" y="1289" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="1329" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1377" font-size="48" font-weight="700" fill="#111111">케이블</text>
<text x="134" y="1429" font-size="39" fill="#333333">100W는 보통 20V 5A이므로 5A를 지원하는</text>
<text x="134" y="1481" font-size="39" fill="#333333">케이블(e-marker 칩 포함)이 필요합니다.</text>
<rect x="64" y="1511" width="952" height="2" fill="#D9C98F"/>
<rect x="66" y="1551" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1599" font-size="48" font-weight="700" fill="#111111">안전 인증</text>
<text x="134" y="1651" font-size="39" fill="#333333">KC 인증 등 표시를 확인합니다.</text>
<text x="134" y="1733" font-size="30" fill="#3D3D3D">외 1가지는 본문 표에서</text>
<rect x="64" y="1773" width="952" height="2" fill="#111111"/>
<text x="64" y="1829" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1829" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
