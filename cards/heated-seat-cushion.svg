<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1831" viewBox="0 0 1080 1831" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1825" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">전기방석 고르는 법</text>
<rect x="64" y="226" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">전원 방식</text>
<text x="134" y="371" font-size="39" fill="#333333">콘센트형인지 USB형인지, USB형이면 필요한 출력</text>
<text x="134" y="423" font-size="39" fill="#333333">표기</text>
<rect x="64" y="453" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">온도 단계</text>
<text x="134" y="593" font-size="39" fill="#333333">단계 조절이 되는지, 가장 낮은 단계가 충분히</text>
<text x="134" y="645" font-size="39" fill="#333333">낮은지</text>
<rect x="64" y="675" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">자동 꺼짐</text>
<text x="134" y="815" font-size="39" fill="#333333">일정 시간이 지나면 꺼지는 타이머가 있는지</text>
<rect x="64" y="845" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="885" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="933" font-size="48" font-weight="700" fill="#111111">과열 방지</text>
<text x="134" y="985" font-size="39" fill="#333333">과열 보호 기능이 표기돼 있는지</text>
<rect x="64" y="1015" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1055" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1103" font-size="48" font-weight="700" fill="#111111">크기</text>
<text x="134" y="1155" font-size="39" fill="#333333">의자 앉는 면 크기와 맞는지, 등받이까지 덮는</text>
<text x="134" y="1207" font-size="39" fill="#333333">형태인지</text>
<rect x="64" y="1237" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1277" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1325" font-size="48" font-weight="700" fill="#111111">세탁</text>
<text x="134" y="1377" font-size="39" fill="#333333">커버를 분리해 빨 수 있는지, 열선 부분 세탁 금지</text>
<text x="134" y="1429" font-size="39" fill="#333333">안내</text>
<rect x="64" y="1459" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1499" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1547" font-size="48" font-weight="700" fill="#111111">미끄럼 방지</text>
<text x="134" y="1599" font-size="39" fill="#333333">바닥 면에 미끄럼 방지 처리가 있는지</text>
<text x="134" y="1681" font-size="30" fill="#3D3D3D">외 1가지는 본문 표에서</text>
