<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1779" viewBox="0 0 1080 1779" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1773" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">넥워머 소재별 차이와 고르는 법</text>
<rect x="64" y="226" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">소재</text>
<text x="134" y="371" font-size="39" fill="#333333">플리스는 가볍고 따뜻한 편, 니트는 보기 좋지만</text>
<text x="134" y="423" font-size="39" fill="#333333">바람이 들 수 있어요</text>
<rect x="64" y="453" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">안감</text>
<text x="134" y="593" font-size="39" fill="#333333">피부에 닿는 쪽이 부드러운지, 정전기가 잘 생기는</text>
<text x="134" y="645" font-size="39" fill="#333333">소재인지</text>
<rect x="64" y="675" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">길이</text>
<text x="134" y="815" font-size="39" fill="#333333">코까지 올려 쓸 수 있는 길이인지, 목만 감싸는</text>
<text x="134" y="867" font-size="39" fill="#333333">짧은 형태인지</text>
<rect x="64" y="897" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="937" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="985" font-size="48" font-weight="700" fill="#111111">조임</text>
<text x="134" y="1037" font-size="39" fill="#333333">위쪽 조임 끈이 있어 바람을 막을 수 있는지</text>
<rect x="64" y="1067" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1107" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1155" font-size="48" font-weight="700" fill="#111111">통기성</text>
<text x="134" y="1207" font-size="39" fill="#333333">운동용이라면 숨 쉬는 부분이 답답하지 않은지</text>
<rect x="64" y="1237" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1277" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1325" font-size="48" font-weight="700" fill="#111111">세탁</text>
<text x="134" y="1377" font-size="39" fill="#333333">물세탁 가능 여부와 보풀이 생기기 쉬운 소재인지</text>
<rect x="64" y="1407" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1447" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1495" font-size="48" font-weight="700" fill="#111111">크기</text>
<text x="134" y="1547" font-size="39" fill="#333333">머리를 넣어 쓰는 형태라면 머리둘레에 맞게</text>
<text x="134" y="1599" font-size="39" fill="#333333">늘어나는지</text>
<rect x="64" y="1669" width="952" height="2" fill="#111111"/>
<text x="64" y="1725" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1725" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
