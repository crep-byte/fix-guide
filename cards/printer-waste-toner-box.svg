<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1797" viewBox="0 0 1080 1797" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1791" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">복합기 폐토너통 교체 시기와 호환품</text>
<text x="64" y="260" font-size="52" font-weight="700" fill="#111111">고를 때 확인할 것</text>
<rect x="64" y="296" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="341" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="389" font-size="48" font-weight="700" fill="#111111">기기 정확한 모델명</text>
<text x="134" y="441" font-size="39" fill="#333333">비슷한 모델명이어도 부품이 다를 수 있습니다.</text>
<rect x="64" y="471" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="511" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="559" font-size="48" font-weight="700" fill="#111111">폐토너통 부품 번호</text>
<text x="134" y="611" font-size="39" fill="#333333">기기 설명서나 제조사 사이트의 번호와</text>
<text x="134" y="663" font-size="39" fill="#333333">대조합니다.</text>
<rect x="64" y="693" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="733" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="781" font-size="48" font-weight="700" fill="#111111">정품과 호환품 구분</text>
<text x="134" y="833" font-size="39" fill="#333333">호환품은 제조사가 보증하는 부품이 아닙니다.</text>
<text x="134" y="885" font-size="39" fill="#333333">보증 조건을 확인합니다.</text>
<rect x="64" y="915" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="955" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1003" font-size="48" font-weight="700" fill="#111111">카운터 초기화 필요 여부</text>
<text x="134" y="1055" font-size="39" fill="#333333">일부 기기는 교체 후 칩이나 설정으로 초기화가</text>
<text x="134" y="1107" font-size="39" fill="#333333">필요합니다. 상품 설명을 확인합니다.</text>
<rect x="64" y="1137" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1177" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1225" font-size="48" font-weight="700" fill="#111111">구성 수량</text>
<text x="134" y="1277" font-size="39" fill="#333333">통 하나인지, 여러 개 묶음인지 확인합니다.</text>
<rect x="64" y="1307" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1347" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1395" font-size="48" font-weight="700" fill="#111111">실링 상태</text>
<text x="134" y="1447" font-size="39" fill="#333333">가루가 새지 않게 밀봉된 제품인지 봅니다.</text>
<rect x="64" y="1477" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1517" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1565" font-size="48" font-weight="700" fill="#111111">반품·교환 조건</text>
<text x="134" y="1617" font-size="39" fill="#333333">규격이 맞지 않을 때를 대비해 확인합니다.</text>
<rect x="64" y="1687" width="952" height="2" fill="#111111"/>
<text x="64" y="1743" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1743" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
