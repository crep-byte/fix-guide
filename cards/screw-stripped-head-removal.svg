<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1935" viewBox="0 0 1080 1935" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1929" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">나사 머리가 뭉개졌을 때 빼는 법</text>
<rect x="64" y="226" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">머리가 튀어나와 있는가</text>
<text x="134" y="371" font-size="39" fill="#333333">튀어나와 있으면 잠금 플라이어나 추출 플라이어로</text>
<text x="134" y="423" font-size="39" fill="#333333">물 수 있습니다. 평평하면 추출 비트가 맞습니다.</text>
<rect x="64" y="453" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">나사 머리 지름</text>
<text x="134" y="593" font-size="39" fill="#333333">플라이어의 물림 범위에 들어와야 합니다. 제품</text>
<text x="134" y="645" font-size="39" fill="#333333">표기를 확인합니다.</text>
<rect x="64" y="675" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">나사 굵기 범위</text>
<text x="134" y="815" font-size="39" fill="#333333">추출 비트는 대개 적용 나사 굵기가 정해져</text>
<text x="134" y="867" font-size="39" fill="#333333">있습니다.</text>
<rect x="64" y="897" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="937" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="985" font-size="48" font-weight="700" fill="#111111">작업 위치의 여유 공간</text>
<text x="134" y="1037" font-size="39" fill="#333333">좁은 곳에서는 플라이어가 들어가지 않을 수</text>
<text x="134" y="1089" font-size="39" fill="#333333">있습니다.</text>
<rect x="64" y="1119" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1159" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1207" font-size="48" font-weight="700" fill="#111111">사용 공구</text>
<text x="134" y="1259" font-size="39" fill="#333333">전동드릴에 물릴 비트인지, 손으로 돌리는</text>
<text x="134" y="1311" font-size="39" fill="#333333">공구인지 확인합니다.</text>
<rect x="64" y="1341" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1381" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1429" font-size="48" font-weight="700" fill="#111111">비트 재질</text>
<text x="134" y="1481" font-size="39" fill="#333333">단단한 재질일수록 홈을 잘 물지만, 무리하게 힘을</text>
<text x="134" y="1533" font-size="39" fill="#333333">주면 비트가 부러질 수 있습니다.</text>
<rect x="64" y="1563" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1603" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1651" font-size="48" font-weight="700" fill="#111111">세트 구성</text>
<text x="134" y="1703" font-size="39" fill="#333333">한 번만 쓸 거라면 낱개, 여러 크기를 쓸 거라면</text>
<text x="134" y="1755" font-size="39" fill="#333333">세트가 낫습니다.</text>
<rect x="64" y="1825" width="952" height="2" fill="#111111"/>
<text x="64" y="1881" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1881" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
