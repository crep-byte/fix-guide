<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">종류</text>
<text x="134" y="815" font-size="39" fill="#333333">직물, 금속, 스프레이 중 쓰임에 맞는지</text>
<rect x="64" y="845" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="885" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="933" font-size="48" font-weight="700" fill="#111111">장착 방식</text>
<text x="134" y="985" font-size="39" fill="#333333">차를 움직이지 않고 끼울 수 있는지, 도구가</text>
<text x="134" y="1037" font-size="39" fill="#333333">필요한지</text>
<rect x="64" y="1067" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1107" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1155" font-size="48" font-weight="700" fill="#111111">속도 제한</text>
<text x="134" y="1207" font-size="39" fill="#333333">제품에 적힌 주행 속도 안내를 확인하세요</text>
<rect x="64" y="1237" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1277" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1325" font-size="48" font-weight="700" fill="#111111">차량 여유 공간</text>
<text x="134" y="1377" font-size="39" fill="#333333">휠 안쪽 공간이 좁은 차는 체인이 닿을 수 있어</text>
<text x="134" y="1429" font-size="39" fill="#333333">적용 여부를 확인하세요</text>
