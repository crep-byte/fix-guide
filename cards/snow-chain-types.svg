<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1779" viewBox="0 0 1080 1779" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1773" fill="#FFD400" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#12399B">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">스노우체인 종류와 고르는 법</text>
<rect x="64" y="226" width="952" height="5" fill="#111111"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">타이어 규격</text>
<text x="134" y="371" font-size="39" fill="#333333">타이어 옆면의 규격이 제품의 적용 규격에</text>
<text x="134" y="423" font-size="39" fill="#333333">들어가는지</text>
<rect x="64" y="453" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">장착 바퀴</text>
<text x="134" y="593" font-size="39" fill="#333333">구동 바퀴(앞바퀴 구동인지, 뒷바퀴 구동인지)에</text>
<text x="134" y="645" font-size="39" fill="#333333">장착한다는 안내를 확인하세요</text>
