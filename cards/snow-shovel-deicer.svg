<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1675" viewBox="0 0 1080 1675" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1669" fill="#FFD400" stroke="#111111" stroke-width="6"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#12399B">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">집 앞 눈 치우기</text>
<rect x="64" y="226" width="952" height="5" fill="#111111"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">도구 형태</text>
<text x="134" y="371" font-size="39" fill="#333333">넓게 밀어내는 넉가래인지, 퍼서 옮기는 삽인지</text>
<rect x="64" y="401" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="441" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="489" font-size="48" font-weight="700" fill="#111111">날 폭</text>
<text x="134" y="541" font-size="39" fill="#333333">넓을수록 한 번에 많이 밀지만 무거운 눈에는 힘이</text>
<text x="134" y="593" font-size="39" fill="#333333">더 들어요</text>
<rect x="64" y="623" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="663" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="711" font-size="48" font-weight="700" fill="#111111">날 재질</text>
<text x="134" y="763" font-size="39" fill="#333333">플라스틱은 가볍고 바닥 손상이 적고, 금속 날은</text>
<text x="134" y="815" font-size="39" fill="#333333">다져진 눈을 긁기 좋아요</text>
<rect x="64" y="845" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="885" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="933" font-size="48" font-weight="700" fill="#111111">손잡이 길이</text>
<text x="134" y="985" font-size="39" fill="#333333">키에 맞아 허리를 덜 숙일 수 있는지</text>
<rect x="64" y="1015" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1055" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1103" font-size="48" font-weight="700" fill="#111111">분리·보관</text>
<text x="134" y="1155" font-size="39" fill="#333333">손잡이를 분리해 좁은 곳에 둘 수 있는지</text>
<rect x="64" y="1185" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1225" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1273" font-size="48" font-weight="700" fill="#111111">제설제 성분</text>
<text x="134" y="1325" font-size="39" fill="#333333">염화칼슘인지, 부식을 줄였다고 표기한 제품인지</text>
<rect x="64" y="1355" width="952" height="2" fill="#B89A0C"/>
<rect x="66" y="1395" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="134" y="1443" font-size="48" font-weight="700" fill="#111111">사용 안내</text>
<text x="134" y="1495" font-size="39" fill="#333333">제설제 뿌리는 양과 사용 가능한 바닥 표기</text>
<rect x="64" y="1565" width="952" height="2" fill="#111111"/>
<text x="64" y="1621" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1621" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
