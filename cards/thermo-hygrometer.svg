<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1831" viewBox="0 0 1080 1831" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1825" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">겨울 실내 습도 맞추기</text>
<rect x="64" y="226" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="271" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="319" font-size="48" font-weight="700" fill="#111111">표시 방식</text>
<text x="134" y="371" font-size="39" fill="#333333">디지털은 숫자가 바로 보이고, 바늘식은 건전지가</text>
<text x="134" y="423" font-size="39" fill="#333333">필요 없어요</text>
<rect x="64" y="453" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="493" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="541" font-size="48" font-weight="700" fill="#111111">오차 표기</text>
<text x="134" y="593" font-size="39" fill="#333333">온도와 습도의 오차 범위가 제품 설명에 적혀</text>
<text x="134" y="645" font-size="39" fill="#333333">있는지</text>
<rect x="64" y="675" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="715" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="763" font-size="48" font-weight="700" fill="#111111">화면 크기</text>
<text x="134" y="815" font-size="39" fill="#333333">떨어진 자리에서도 숫자가 읽히는지, 어두운</text>
<text x="134" y="867" font-size="39" fill="#333333">곳에서 보이는지</text>
<rect x="64" y="897" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="937" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="985" font-size="48" font-weight="700" fill="#111111">기록 기능</text>
<text x="134" y="1037" font-size="39" fill="#333333">가장 높았던 값과 낮았던 값을 보여 주면 밤사이</text>
<text x="134" y="1089" font-size="39" fill="#333333">변화를 알 수 있어요</text>
<rect x="64" y="1119" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1159" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1207" font-size="48" font-weight="700" fill="#111111">전원</text>
<text x="134" y="1259" font-size="39" fill="#333333">건전지 종류와 교체 주기 안내</text>
<rect x="64" y="1289" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1329" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1377" font-size="48" font-weight="700" fill="#111111">놓는 방식</text>
<text x="134" y="1429" font-size="39" fill="#333333">세워 두기, 벽걸이, 자석 가운데 둘 자리에 맞는 것</text>
<rect x="64" y="1459" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1499" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1547" font-size="48" font-weight="700" fill="#111111">연결 기능</text>
<text x="134" y="1599" font-size="39" fill="#333333">휴대폰으로 기록을 보는 제품은 앱 지원 여부와</text>
<text x="134" y="1651" font-size="39" fill="#333333">연결 방식을 확인</text>
<rect x="64" y="1721" width="952" height="2" fill="#111111"/>
<text x="64" y="1777" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1777" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
