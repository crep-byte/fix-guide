<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1731" viewBox="0 0 1080 1731" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif" role="img" aria-label="생활 해결 가이드 체크리스트 카드">
<rect x="3" y="3" width="1074" height="1725" rx="24" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="4"/>
<text x="64" y="94" font-size="36" font-weight="700" fill="#08573E">고를 때 체크리스트</text>
<text x="64" y="190" font-size="52" font-weight="700" fill="#111111">벽지 곰팡이 지우는 순서와 곰팡이</text>
<text x="64" y="260" font-size="52" font-weight="700" fill="#111111">제거제 고를 때 주의할 점</text>
<rect x="64" y="296" width="952" height="3" fill="#1B1C1E"/>
<rect x="66" y="341" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="389" font-size="48" font-weight="700" fill="#111111">쓸 수 있는 곳</text>
<text x="134" y="441" font-size="39" fill="#333333">벽지용인지 욕실 타일·실리콘용인지. 용도가</text>
<text x="134" y="493" font-size="39" fill="#333333">다르면 벽지가 상해요</text>
<rect x="64" y="523" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="563" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="611" font-size="48" font-weight="700" fill="#111111">성분 계열</text>
<text x="134" y="663" font-size="39" fill="#333333">염소계는 탈색이 강해 색 있는 벽지가 하얗게 바랠</text>
<text x="134" y="715" font-size="39" fill="#333333">수 있고, 비염소계는 탈색이 덜한 편이에요</text>
<rect x="64" y="745" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="785" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="833" font-size="48" font-weight="700" fill="#111111">형태</text>
<text x="134" y="885" font-size="39" fill="#333333">스프레이는 넓은 면에, 젤은 흘러내리지 않아</text>
<text x="134" y="937" font-size="39" fill="#333333">모서리에 쓰기 편해요</text>
<rect x="64" y="967" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1007" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1055" font-size="48" font-weight="700" fill="#111111">안전 표시</text>
<text x="134" y="1107" font-size="39" fill="#333333">안전확인대상 생활화학제품 신고번호와 주의사항</text>
<text x="134" y="1159" font-size="39" fill="#333333">표기가 있는지</text>
<rect x="64" y="1189" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1229" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1277" font-size="48" font-weight="700" fill="#111111">벽지 종류</text>
<text x="134" y="1329" font-size="39" fill="#333333">종이 벽지는 물에 약해 젖으면 찢어지거나 들떠요.</text>
<text x="134" y="1381" font-size="39" fill="#333333">실크 벽지는 겉이 코팅돼 닦기 쉬워요</text>
<rect x="64" y="1411" width="952" height="2" fill="#E4E2DC"/>
<rect x="66" y="1451" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#1B1C1E" stroke-width="3"/>
<text x="134" y="1499" font-size="48" font-weight="700" fill="#111111">냄새</text>
<text x="134" y="1551" font-size="39" fill="#333333">사용 뒤 환기 시간 안내</text>
<rect x="64" y="1621" width="952" height="2" fill="#111111"/>
<text x="64" y="1677" font-size="34" fill="#333333">쿠팡에서 비교할 때 이 표기를 확인하세요</text>
<text x="1016" y="1677" font-size="34" font-weight="700" fill="#111111" text-anchor="end">duruguide.com</text>
</svg>
