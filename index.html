<style>
:root{--bg:#fff;--fg:#1d1f23;--muted:#5f6670;--line:#e3e6ea;--accent:#0b63ce;--note-bg:#fff4d6;--note-line:#e7b93a;--cta:#d93a2b}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8eaed;--muted:#a0a7b1;--line:#30343a;--accent:#6aa8ff;--note-bg:#3a3018;--note-line:#a07d1c;--cta:#e2574a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--line);padding:14px 0}
header.site a{color:var(--fg);text-decoration:none;font-weight:700}
main{padding:24px 0 48px}
h1{font-size:1.6rem;line-height:1.4;margin:.2em 0 .6em}
h2{font-size:1.25rem;margin:2em 0 .6em;padding-bottom:.3em;border-bottom:2px solid var(--line)}
h3{font-size:1.08rem;margin:1.6em 0 .4em}
.disclosure{background:var(--note-bg);border:1px solid var(--note-line);border-radius:8px;padding:12px 14px;font-size:17px;font-weight:600;line-height:1.6;margin:0 0 20px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 24px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:.85rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.95rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--line) 45%,transparent)}
.cta{text-align:center;margin:32px 0 20px}
.cta a{display:inline-block;background:var(--cta);color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:10px;max-width:100%}
.disclosure-foot{color:var(--muted);font-size:.9rem;text-align:center}
.cards{list-style:none;padding:0;margin:0}
.cards li{border-bottom:1px solid var(--line);padding:18px 0}
.cards h2{border:0;margin:.3em 0;padding:0;font-size:1.15rem}
.cards h2 a{color:var(--fg);text-decoration:none}
.cards p{margin:.2em 0;color:var(--muted);font-size:.95rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:20px 0 40px}
.draft-badge{background:#c62828;color:#fff;padding:2px 8px;border-radius:4px;font-size:.8rem}
</style>
